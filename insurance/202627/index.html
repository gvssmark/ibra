<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBA Group Medical Insurance – Retirees 2026-27</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --text: #1c2430; --muted: #667085;
    --border: #dfe3ea; --accent: #1f5fbf; --accent-soft: #e8f0fc; --row-hover: #f0f5ff;
    --shadow: 0 10px 40px rgba(16, 24, 40, .25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --surface: #1b212a; --text: #e6e9ee; --muted: #98a2b3;
      --border: #2c3542; --accent: #6aa3f5; --accent-soft: #1f2d44; --row-hover: #222c3b;
      --shadow: 0 10px 40px rgba(0, 0, 0, .6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px 14px 40px; }
  h1 { font-size: 1.2rem; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: .85rem; margin: 0 0 14px; }

  .filters {
    display: grid; gap: 10px; grid-template-columns: 1fr 2fr 2fr 1.3fr auto;
    align-items: end; margin-bottom: 10px;
  }
  .field label { display: block; font-size: .72rem; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
  .field input, .field select {
    width: 100%; padding: 9px 10px; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  }
  .field input:focus, .field select:focus, button:focus-visible, tr:focus-visible, th:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .btn {
    padding: 9px 14px; font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--accent-soft); }
  .btn:disabled { opacity: .45; cursor: default; }

  .meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
    gap: 8px; color: var(--muted); font-size: .85rem; margin: 6px 2px 8px; }
  .meta select { font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }

  .table-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { position: sticky; top: 0; background: var(--surface); font-size: .78rem; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: var(--text); }
  th .arrow { display: inline-block; width: 1em; color: var(--accent); }
  td.id { font-variant-numeric: tabular-nums; white-space: nowrap; width: 1%; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: 0; }
  .dim { color: var(--muted); }
  .empty { padding: 36px 12px; text-align: center; color: var(--muted); }

  .pager { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .pager .info { color: var(--muted); font-size: .85rem; min-width: 110px; text-align: center; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(10, 14, 20, .55); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); color: var(--text); width: 100%; max-width: 560px; max-height: 92vh;
    border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
  .modal header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
  .modal h2 { font-size: 1.1rem; margin: 0; }
  .modal .idline { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .x { border: 0; background: transparent; color: var(--muted); font-size: 1.6rem; line-height: 1;
    cursor: pointer; padding: 0 4px; }
  .x:hover { color: var(--text); }
  .modal .body { overflow-y: auto; padding: 6px 18px 14px; }
  .sec { margin-top: 12px; }
  .sec h3 { margin: 0 0 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  dl { margin: 0; display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; }
  dt { color: var(--muted); font-size: .88rem; }
  dd { margin: 0; word-break: break-word; }
  .modal footer { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 18px; border-top: 1px solid var(--border); }
  .modal footer .pos { color: var(--muted); font-size: .82rem; }

  @media (max-width: 760px) {
    .filters { grid-template-columns: 1fr 1fr; }
    .filters .f-name, .filters .f-spouse { grid-column: span 2; }
    th, td { padding: 9px 8px; }
    dl { grid-template-columns: 112px 1fr; }
  }
  @media (max-width: 480px) {
    .overlay { padding: 0; align-items: flex-end; }
    .modal { max-width: none; max-height: 94vh; border-radius: 16px 16px 0 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>IBA Group Medical Insurance Scheme for Retirees 2026-27</h1>
  <p class="sub">List of retirees who paid the insurance premium in Oct'26 &middot; tap a row for full details</p>

  <div class="filters">
    <div class="field"><label for="fId">Employee ID</label><input id="fId" type="search" inputmode="search" autocomplete="off" placeholder="e.g. 7001"></div>
    <div class="field f-name"><label for="fName">Name</label><input id="fName" type="search" autocomplete="off" placeholder="Search name"></div>
    <div class="field f-spouse"><label for="fSpouse">Spouse name</label><input id="fSpouse" type="search" autocomplete="off" placeholder="Search spouse name"></div>
    <div class="field"><label for="fCover">Cover type</label>
      <select id="fCover"><option value="">All</option></select></div>
    <button class="btn" id="clear" type="button">Clear</button>
  </div>

  <div class="meta">
    <span id="count"></span>
    <label>Rows per page
      <select id="pageSize"><option>25</option><option selected>50</option><option>100</option><option>250</option></select>
    </label>
  </div>

  <div class="table-box">
    <table>
      <thead><tr>
        <th data-k="id" tabindex="0" aria-sort="none">Employee ID <span class="arrow"></span></th>
        <th data-k="name" tabindex="0" aria-sort="none">Name <span class="arrow"></span></th>
        <th data-k="spouseName" tabindex="0" aria-sort="none">Spouse name <span class="arrow"></span></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="pager">
    <button class="btn" id="first" type="button" aria-label="First page">&laquo;</button>
    <button class="btn" id="prev" type="button">&lsaquo; Prev</button>
    <span class="info" id="pageInfo"></span>
    <button class="btn" id="next" type="button">Next &rsaquo;</button>
    <button class="btn" id="last" type="button" aria-label="Last page">&raquo;</button>
  </div>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header>
      <div>
        <h2 id="mTitle"></h2>
        <div class="idline" id="mSub"></div>
      </div>
      <button class="x" id="mClose" type="button" aria-label="Close">&times;</button>
    </header>
    <div class="body" id="mBody"></div>
    <footer>
      <button class="btn" id="mPrev" type="button">&lsaquo; Previous</button>
      <span class="pos" id="mPos"></span>
      <button class="btn" id="mNext" type="button">Next &rsaquo;</button>
    </footer>
  </div>
</div>

<script src="data.js"></script>
<script>
(function () {
  "use strict";

  if (!window.RETIREE_DATA) {
    document.getElementById("tbody").innerHTML =
      '<tr><td colspan="3" class="empty">Could not load data.js. Make sure it sits next to index.html.</td></tr>';
    return;
  }

  // ---------- Data ----------
  var C = {}; // column index lookup
  RETIREE_DATA.cols.forEach(function (k, i) { C[k] = i; });

  var norm = function (s) { return String(s || "").toLowerCase().replace(/[.\s]+/g, " ").trim(); };

  var DATA = RETIREE_DATA.rows.map(function (r) {
    return { r: r, id: r[C.id].toLowerCase(), name: norm(r[C.name]), sp: norm(r[C.spouseName]) };
  });

  // ---------- State ----------
  var view = DATA.slice();           // filtered + sorted rows
  var page = 1, pageSize = 50;
  var sortKey = null, sortDir = 1;   // sortDir: 1 asc, -1 desc
  var modalIndex = -1, lastFocus = null;

  var $ = function (id) { return document.getElementById(id); };
  var fId = $("fId"), fName = $("fName"), fSpouse = $("fSpouse"), fCover = $("fCover");
  var tbody = $("tbody");

  // cover-type dropdown from the data
  Array.from(new Set(DATA.map(function (d) { return d.r[C.coverType]; }))).sort().forEach(function (v) {
    var o = document.createElement("option"); o.value = v; o.textContent = v; fCover.appendChild(o);
  });

  // ---------- Helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function dateOrDash(s) { return (!s || /\/1900$/.test(s)) ? "" : s; }
  function money(s) { return s ? "\u20B9 " + Number(s).toLocaleString("en-IN") : ""; }
  function gender(g) { return g === "F" ? "Female" : g === "M" ? "Male" : g; }

  // ---------- Filter + sort ----------
  function applyFilters() {
    var q1 = fId.value.trim().toLowerCase(),
        q2 = norm(fName.value),
        q3 = norm(fSpouse.value),
        cv = fCover.value;

    view = DATA.filter(function (d) {
      return (!q1 || d.id.indexOf(q1) !== -1) &&
             (!q2 || d.name.indexOf(q2) !== -1) &&
             (!q3 || d.sp.indexOf(q3) !== -1) &&
             (!cv || d.r[C.coverType] === cv);
    });

    if (sortKey) {
      var i = C[sortKey];
      view.sort(function (a, b) {
        var x = a.r[i], y = b.r[i];
        // blanks always last
        if (!x && y) return 1;
        if (x && !y) return -1;
        return x.localeCompare(y, undefined, { numeric: true, sensitivity: "base" }) * sortDir;
      });
    }
    page = 1;
    render();
  }

  // ---------- Render ----------
  function render() {
    var total = view.length;
    var pages = Math.max(1, Math.ceil(total / pageSize));
    if (page > pages) page = pages;
    var start = (page - 1) * pageSize, end = Math.min(start + pageSize, total);

    if (!total) {
      tbody.innerHTML = '<tr><td colspan="3" class="empty">No matching records.</td></tr>';
    } else {
      var html = "";
      for (var i = start; i < end; i++) {
        var r = view[i].r;
        html += '<tr tabindex="0" data-i="' + i + '">' +
          '<td class="id">' + esc(r[C.id]) + '</td>' +
          '<td>' + (r[C.name] ? esc(r[C.name]) : '<span class="dim">\u2014</span>') + '</td>' +
          '<td>' + (r[C.spouseName] ? esc(r[C.spouseName]) : '<span class="dim">\u2014</span>') + '</td></tr>';
      }
      tbody.innerHTML = html;
    }

    $("count").textContent = total === DATA.length
      ? total.toLocaleString("en-IN") + " retirees"
      : total.toLocaleString("en-IN") + " of " + DATA.length.toLocaleString("en-IN") + " retirees match";
    $("pageInfo").textContent = "Page " + page + " of " + pages;
    $("first").disabled = $("prev").disabled = page <= 1;
    $("next").disabled = $("last").disabled = page >= pages;

    document.querySelectorAll("th[data-k]").forEach(function (th) {
      var on = th.dataset.k === sortKey;
      th.querySelector(".arrow").textContent = on ? (sortDir === 1 ? "\u25B2" : "\u25BC") : "";
      th.setAttribute("aria-sort", on ? (sortDir === 1 ? "ascending" : "descending") : "none");
    });
  }

  // ---------- Modal ----------
  function row(label, value) {
    return "<dt>" + label + "</dt><dd>" + (value ? esc(value) : '<span class="dim">\u2014</span>') + "</dd>";
  }

  function openModal(i) {
    if (i < 0 || i >= view.length) return;
    modalIndex = i;
    var r = view[i].r;
    var hasSpouse = !!(r[C.spouseName] || dateOrDash(r[C.spouseDob]));

    $("mTitle").textContent = r[C.name] || "(Name not available)";
    $("mSub").textContent = "Employee ID " + r[C.id] + "  \u00B7  Sl. No. " + r[C.sl];

    $("mBody").innerHTML =
      '<div class="sec"><h3>Retiree</h3><dl>' +
        row("Employee ID", r[C.id]) +
        row("Name", r[C.name]) +
        row("Gender", gender(r[C.gender])) +
        row("Date of birth", dateOrDash(r[C.retDob])) +
        row("Cadre", r[C.cadre]) +
      '</dl></div>' +
      '<div class="sec"><h3>Spouse</h3>' +
        (hasSpouse
          ? '<dl>' + row("Name", r[C.spouseName]) + row("Date of birth", dateOrDash(r[C.spouseDob])) +
            row("Gender", gender(r[C.spouseGender])) + '</dl>'
          : '<div class="dim">No spouse details in the list.</div>') +
      '</div>' +
      '<div class="sec"><h3>Cover</h3><dl>' +
        row("Cover type", r[C.coverType]) +
        row("Float type", r[C.floatType]) +
        row("Base sum insured", money(r[C.baseSi])) +
        row("Top-up sum insured", money(r[C.topupSi])) +
      '</dl></div>';

    $("mPos").textContent = (i + 1).toLocaleString("en-IN") + " of " + view.length.toLocaleString("en-IN");
    $("mPrev").disabled = i <= 0;
    $("mNext").disabled = i >= view.length - 1;

    var ov = $("overlay");
    if (!ov.classList.contains("open")) lastFocus = document.activeElement;
    ov.classList.add("open");
    ov.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    $("mBody").scrollTop = 0;
    $("mClose").focus();
  }

  function closeModal() {
    var ov = $("overlay");
    ov.classList.remove("open");
    ov.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  // ---------- Events ----------
  var timer;
  function debounced() { clearTimeout(timer); timer = setTimeout(applyFilters, 150); }
  [fId, fName, fSpouse].forEach(function (el) { el.addEventListener("input", debounced); });
  fCover.addEventListener("change", applyFilters);

  $("clear").addEventListener("click", function () {
    fId.value = fName.value = fSpouse.value = ""; fCover.value = "";
    sortKey = null; sortDir = 1; applyFilters(); fName.focus();
  });

  $("pageSize").addEventListener("change", function () { pageSize = +this.value; page = 1; render(); });
  $("first").addEventListener("click", function () { page = 1; render(); });
  $("prev").addEventListener("click", function () { page--; render(); });
  $("next").addEventListener("click", function () { page++; render(); });
  $("last").addEventListener("click", function () { page = Math.ceil(view.length / pageSize); render(); });

  function sortBy(th) {
    var k = th.dataset.k;
    if (sortKey !== k) { sortKey = k; sortDir = 1; }
    else if (sortDir === 1) { sortDir = -1; }
    else { sortKey = null; sortDir = 1; }
    applyFilters();
  }
  document.querySelectorAll("th[data-k]").forEach(function (th) {
    th.addEventListener("click", function () { sortBy(th); });
    th.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sortBy(th); }
    });
  });

  tbody.addEventListener("click", function (e) {
    var tr = e.target.closest("tr[data-i]");
    if (tr) openModal(+tr.dataset.i);
  });
  tbody.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var tr = e.target.closest("tr[data-i]");
    if (tr) { e.preventDefault(); openModal(+tr.dataset.i); }
  });

  $("mClose").addEventListener("click", closeModal);
  $("overlay").addEventListener("click", function (e) { if (e.target === this) closeModal(); });
  $("mPrev").addEventListener("click", function () { openModal(modalIndex - 1); });
  $("mNext").addEventListener("click", function () { openModal(modalIndex + 1); });

  document.addEventListener("keydown", function (e) {
    if (!$("overlay").classList.contains("open")) return;
    if (e.key === "Escape") closeModal();
    else if (e.key === "ArrowLeft") openModal(modalIndex - 1);
    else if (e.key === "ArrowRight") openModal(modalIndex + 1);
    else if (e.key === "Tab") {           // keep focus inside the dialog
      var f = Array.from($("overlay").querySelectorAll("button:not(:disabled)"));
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  render();
})();
</script>
</body>
</html>
